<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labbaik Perfume | Exclusive Catalog</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background AI Glow -->
    <div class="glow-overlay"></div>

    <header>
        <div class="container">
            <div class="logo-container">
                <!-- Circular Animation Ring -->
                <div class="orbit-ring"></div>
                <img src="logo.png" alt="Labbaik Logo" class="main-logo">
            </div>
            <h1 class="brand-name">LABBAIK PERFUME</h1>
        </div>
    </header>

    <section class="hero-search">
        <div class="container">
            <p class="intro-text">Search our exclusive collection of premium fragrances.</p>
            <div class="search-glass-box">
                <input type="text" id="perfumeSearch" placeholder="Type a perfume name (e.g. Ramza)..." autocomplete="off">
                <div class="search-highlight"></div>
            </div>
            <p id="counter" class="stats">Discovering 15 masterpieces</p>
        </div>
    </section>

    <main class="container">
        <div id="perfumeGrid" class="catalog-grid">
            <!-- Data injected by script.js -->
        </div>
        
        <div id="emptyState" class="empty-state hidden">
            <p>Scent not found. Please refine your search.</p>
        </div>
    </main>

    <footer>
        <div class="container">
            <p class="owner-tag">Curated by Rafiullah Khan</p>
            <p class="copyright">© 2024 Labbaik Perfume. International Standard.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
